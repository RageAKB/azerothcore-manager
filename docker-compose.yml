version: '3.8'

services:
  azerothcore-manager:
    build: .
    container_name: ac-manager
    ports:
      - "7400:8088"
    environment:
      - LOG_DIR=/azerothcore-wotlk/env/dist/logs
      - CONFIG_DIR=/azerothcore-wotlk/env/dist/etc
      - BACKUP_DIR=/azerothcore/backups
      - DB_HOST=ac-database
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=acore_auth
    networks:
      - ac-network

networks:
  ac-network:
    external: true
